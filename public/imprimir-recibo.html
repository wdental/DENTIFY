<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dentify - Recibo de pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilos.css">
<link rel="stylesheet" href="/css/impresion.css">
<link rel="stylesheet" href="/css/impresion-consentimiento.css">
<link rel="stylesheet" href="/css/impresion-caja.css">
<style>
    /* Media hoja: A5 vertical (148 x 210 mm), mismos margenes que el membrete */
    @media print { @page { size: A5 portrait; margin: 1.2cm 1.3cm; } }
</style>
</head>
<body class="cuerpo-impresion">

<div class="barra-impresion no-imprimir">
    <span>Vista de impresión — Recibo de pago (A5)</span>
    <div>
        <button type="button" class="btn btn-secundario btn-sm" onclick="window.close()">Cerrar</button>
        <button type="button" class="btn btn-primario btn-sm" onclick="window.print()">Imprimir / Guardar como PDF</button>
    </div>
</div>

<div id="contenido-impresion">
    <p class="no-imprimir" style="padding: 40px; text-align:center;">Cargando recibo...</p>
</div>

<script src="/js/api.js"></script>
<script src="/js/fechas.js"></script>
<script src="/js/imprimir-caja.js"></script>
<script src="/js/imprimir-recibo.js"></script>
</body>
</html>
